<!-- Collapsable Panel Component -->
<!-- Usage: <div class="panel-collapsable" data-section="training"> -->

<template id="collapsable-panel-template">
  <div class="panel-collapsable">
    <div class="panel-header-collapsable">
      <div class="panel-title-group">
        <h2 class="panel-title-collapsable">Section Title</h2>
        <span class="panel-subtitle-collapsable"></span>
      </div>
      <button class="panel-toggle-btn" aria-expanded="true">
        <span class="toggle-icon">▼</span>
      </button>
    </div>
    <div class="panel-content-collapsable">
      <!-- Content goes here -->
    </div>
  </div>
</template>
